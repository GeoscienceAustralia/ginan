# Reusable workflow: builds the GinanTauri desktop app (scripts/GinanTauri) for
# Windows, macOS (Apple silicon + Intel) and Linux.
#
# Called from release.yml. When `release_id` is given, the installers are
# uploaded to that GitHub release; they are always uploaded as workflow
# artifacts too, so a build-only run still gives you something to download.
#
# The app does not bundle Ginan/PEA: it downloads the pea binary for its
# platform from the GeoscienceAustralia/ginan releases at runtime (see
# src-tauri/src/commands/execution.rs), so this job does not depend on any
# Ginan C++ build job.
#
# Code signing is optional. Each secret below is only passed to the build when
# it is set, so the workflow works (with unsigned bundles) in a repo that has
# none of them:
#   macOS (Developer ID signing + notarisation):
#     APPLE_CERTIFICATE            base64 of the .p12 signing certificate
#     APPLE_CERTIFICATE_PASSWORD   password of that .p12
#     APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#     APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#                                  for notarisation
#   Without them, macOS bundles are ad-hoc signed (identity "-"), which Apple
#   silicon needs to run at all; users must still allow the app in
#   System Settings > Privacy & Security on first launch.
#   Tauri updater (only used if bundle.createUpdaterArtifacts is enabled):
#     TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   Windows bundles are not Authenticode-signed (SmartScreen will warn).

name: Build GinanTauri

on:
  workflow_call:
    inputs:
      release_id:
        description: GitHub release id to upload the bundles to. Empty = build only.
        type: string
        default: ''
      app_version:
        description: Version stamped into the app (X.Y.Z). Empty = keep tauri.conf.json.
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write # upload release assets

env:
  APP_DIR: scripts/GinanTauri

jobs:
  build:
    name: GinanTauri ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ginantauri-windows-x64
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: ginantauri-macos-arm64
          - name: macOS x64
            # Cross-compiled on the Apple silicon runner; the pea download
            # suffix is chosen per compile target, so this build fetches the
            # macos-x64 pea.
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: ginantauri-macos-x64
          - name: Linux x64
            # Oldest supported Ubuntu runner, so the .deb/AppImage link against
            # an older glibc and run on more distros.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ginantauri-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file patchelf pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri -> target
          key: ${{ matrix.target }}

      # The app's own scripts (justfile, beforeBuildCommand) use npm, so the
      # build uses package-lock.json rather than pnpm-lock.yaml.
      - name: Install frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Stamp app version
        if: inputs.app_version != ''
        working-directory: ${{ env.APP_DIR }}/src-tauri
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
            conf.version = process.env.APP_VERSION;
            fs.writeFileSync("tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '
          echo "Building GinanTauri $APP_VERSION"

      # Only export the signing variables that actually have a value: Tauri
      # treats a set-but-empty APPLE_CERTIFICATE as "import this certificate"
      # and fails.
      - name: Configure optional code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export_if_set() {
            local name="$1"
            local value="${!name}"
            if [ -n "$value" ]; then
              local delim="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
              echo "$name: set"
            fi
          }
          export_if_set TAURI_SIGNING_PRIVATE_KEY
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ]; then
              for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                       APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                export_if_set "$v"
              done
            else
              echo "No Apple certificate configured: ad-hoc signing the app bundle."
              echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build (and upload to release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.APP_DIR }}
          # Use the locally installed CLI from the npm install above.
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          releaseId: ${{ inputs.release_id }}

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
