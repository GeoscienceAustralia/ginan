# E10: causal 02:04 regression experiment.  Processing begins at 00:00 so
# the persistent integer ledger and graph history are warm when the known
# 02:04 topology event occurs; acceptance is evaluated over 01:58--02:10.
processing_options:
  epoch_control:
    start_epoch: 2019-07-18 00:00:00
    end_epoch: 2019-07-18 02:10:00
    epoch_interval: 60

  gnss_general:
    zhang_full_rank:
      # The dense per-epoch SVD rank audit is covered by unit tests and is not
      # part of the 02:04 transaction/continuity acceptance test.
      output_diagnostics: false
      sys_options:
        gps:
          state_edge_grace_epochs: 10
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: true
      current_state_relinking: true
      max_topology_targets: 3
      promotion_confirmation_epochs: 5
      promotion_confirmation_max_gap_seconds: 120
      conflict_quarantine: true
      transactional_integer_fixing: true
      held_constraint_nis_alpha: 1.0e-6
      product_filename: ./outputs/zhang_global_2019199_e10_transactional/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e10_transactional/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e10_transactional
  metadata:
    config_description: zhang_global_2019199_e10_transactional_fixed_branch
