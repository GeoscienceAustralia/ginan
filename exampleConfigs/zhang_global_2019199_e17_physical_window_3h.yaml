# E17-B: fail-closed physical-arc WL fixed-lag shadow estimator.
processing_options:
  epoch_control:
    start_epoch: 2019-07-18 00:00:00
    end_epoch: 2019-07-18 03:00:00
    epoch_interval: 60
  gnss_general:
    zhang_full_rank:
      output_diagnostics: false
      sys_options:
        gps:
          state_edge_grace_epochs: 10
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      output_diagnostics: true
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: true
      current_state_relinking: true
      max_topology_targets: 3
      deterministic_relink_variance_tolerance_cycles2: 1.0e-10
      multi_epoch_relink_shadow: false
      multi_epoch_relink_shadow_information_floor: 1.0e-8
      whitened_wl_fixed_lag_shadow: true
      whitened_wl_fixed_lag_seconds: 1800
      whitened_wl_fixed_lag_max_observations: 60
      whitened_wl_prediction_gate_min_observations: 3
      whitened_wl_prediction_gate_sigma: 4
      promotion_confirmation_epochs: 5
      promotion_confirmation_max_gap_seconds: 120
      conflict_quarantine: true
      transactional_integer_fixing: true
      held_constraint_nis_alpha: 1.0e-6
      product_target_named_rounding: true
      maximum_pppar_correction_sigma_m: 0.5
      maximum_product_residual_step_m: 0.5
      product_filename: ./outputs/zhang_global_2019199_e17_physical_window_3h/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e17_physical_window_3h/zhang_internal_product_covariance.csv
outputs:
  outputs_root: ./outputs/zhang_global_2019199_e17_physical_window_3h
  metadata:
    config_description: zhang_global_2019199_e17_physical_window_3h
