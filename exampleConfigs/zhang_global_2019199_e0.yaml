# E0: Stage-B improvement-3 baseline.  This is T1 with unrestricted joint
# L1C/L2W LAMBDA and the enhanced event/common-arc diagnostics.
processing_options:
  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 2
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: JOINT
      product_filename: ./outputs/zhang_global_2019199_e0/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e0/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e0
  metadata:
    config_description: zhang_global_2019199_e0
