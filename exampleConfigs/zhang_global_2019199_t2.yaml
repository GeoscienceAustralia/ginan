# T2 experiment: freeze the represented core and only accept exact/leaf changes.
processing_options:
  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 2
          prefer_historical_edges: true
          core_skeleton: true
    zhang_pppar:
      product_filename: ./outputs/zhang_global_2019199_t2/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_t2/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_t2
  metadata:
    config_description: zhang_global_2019199_t2
