# E7-C: combined topology-aware dual-frequency bridge scheduling and current
# dynamic-state relinking.
processing_options:
  gnss_general:
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: true
      current_state_relinking: true
      max_topology_targets: 3
      product_filename: ./outputs/zhang_global_2019199_e7c/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e7c/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e7c
  metadata:
    config_description: zhang_global_2019199_e7c_bridge_and_relink
