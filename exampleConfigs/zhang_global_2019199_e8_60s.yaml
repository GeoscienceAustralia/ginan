# E8: increase the effective processing cadence from 300 s to 60 s while
# retaining the same approximately 10 minute historical-edge grace duration.
# Both persistent-component bridging and current-state relinking are enabled.
processing_options:
  epoch_control:
    epoch_interval: 60

  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 10
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: true
      current_state_relinking: true
      max_topology_targets: 3
      product_filename: ./outputs/zhang_global_2019199_e8_60s/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e8_60s/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e8_60s
  metadata:
    config_description: zhang_global_2019199_e8_60s_bridge_and_relink
