# E4: product-datum event attribution and physical/satellite support redundancy
# diagnostics.  Estimation remains identical to E3; product release stays
# closed and no direct product-target LAMBDA is enabled.
processing_options:
  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 2
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: LAYERED_WL_L1
      product_filename: ./outputs/zhang_global_2019199_e4/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e4/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e4
  metadata:
    config_description: zhang_global_2019199_e4_product_datum_attribution
