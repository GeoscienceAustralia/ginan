# E7 controlled baseline: use the corrected local-alignment state semantics,
# but disable both topology bridge targeting and explicit current relinking.
processing_options:
  gnss_general:
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: false
      current_state_relinking: false
      max_topology_targets: 3
      product_filename: ./outputs/zhang_global_2019199_e7base/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e7base/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e7base
  metadata:
    config_description: zhang_global_2019199_e7base_corrected_alignment_baseline
