# E9: retain the E8 60 s cadence, but require five consecutive integer
# confirmations before a new persistent relation is promoted and quarantine
# a satellite's current alignment when it conflicts with an existing datum.
processing_options:
  epoch_control:
    epoch_interval: 60

  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 10
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: true
      current_state_relinking: true
      max_topology_targets: 3
      promotion_confirmation_epochs: 5
      promotion_confirmation_max_gap_seconds: 120
      conflict_quarantine: true
      product_filename: ./outputs/zhang_global_2019199_e9_60s_guarded/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e9_60s_guarded/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e9_60s_guarded
  metadata:
    config_description: zhang_global_2019199_e9_60s_guarded_promotion
