# E6: decouple the dynamic estimation S-basis from the persistent satellite
# product integer datum.  Named G_sat L1/WL targets are promoted into a
# satellite-only integer-potential ledger; L2 follows conditionally from
# L1-WL.  Exact tree exchanges update alpha without changing product version.
processing_options:
  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 2
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      product_filename: ./outputs/zhang_global_2019199_e6/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e6/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e6
  metadata:
    config_description: zhang_global_2019199_e6_persistent_satellite_datum
