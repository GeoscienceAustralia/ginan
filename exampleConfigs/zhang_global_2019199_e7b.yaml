# E7-B: relink lost current dynamic satellite alignments to an existing
# persistent dual-frequency component; do not schedule inter-component bridges.
processing_options:
  gnss_general:
    zhang_pppar:
      integer_strategy: PRODUCT_TARGET_WL_L1
      component_bridge_targeting: false
      current_state_relinking: true
      max_topology_targets: 3
      product_filename: ./outputs/zhang_global_2019199_e7b/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e7b/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e7b
  metadata:
    config_description: zhang_global_2019199_e7b_current_relink
