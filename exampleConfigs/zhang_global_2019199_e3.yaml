# E3 diagnostic: retain the E2 WL-then-conditional-L1 estimator while
# evaluating the exact persistent-product G_sat target lattice every epoch.
# This overlay does not enable product release or direct product-target LAMBDA;
# it is the six-hour diagnostic gate required before either change is safe.
processing_options:
  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 2
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      integer_strategy: LAYERED_WL_L1
      product_filename: ./outputs/zhang_global_2019199_e3/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_e3/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_e3
  metadata:
    config_description: zhang_global_2019199_e3_exact_product_lattice_diagnostic
