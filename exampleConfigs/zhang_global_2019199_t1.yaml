# T1 experiment: persistent state graph plus historical replacement-edge priority.
processing_options:
  gnss_general:
    zhang_full_rank:
      sys_options:
        gps:
          state_edge_grace_epochs: 2
          prefer_historical_edges: true
          core_skeleton: false
    zhang_pppar:
      product_filename: ./outputs/zhang_global_2019199_t1/zhang_internal_products.csv
      product_covariance_filename: ./outputs/zhang_global_2019199_t1/zhang_internal_product_covariance.csv

outputs:
  outputs_root: ./outputs/zhang_global_2019199_t1
  metadata:
    config_description: zhang_global_2019199_t1
