[package]
name = "ginan-tauri"
version = "1.0.0"
description = "Desktop GUI for the Ginan GNSS processing engine (PEA)"
authors = ["Geoscience Australia"]
license = "Apache-2.0"
repository = "https://github.com/GeoscienceAustralia/ginan"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ginan_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Unpacking and checking the Homebrew libomp bottle PEA needs on macOS
# (commands/pea_runtime.rs).
tar = "0.4"
sha2 = "0.10"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Profiling only (`--features profiling`). 0.3.3 is the last release that
# builds against the tauri 2.10 the app is locked to; 0.3.4 needs 2.11.
tauri-plugin-tracing = { version = "=0.3.3", optional = true, features = ["flamegraph"] }
# The tracing plugin's CPU sampling companion. A direct dependency because
# tauri-build only sees the permissions of plugins the app depends on itself.
tauri-plugin-profiling = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Devices_Communication", "Win32_System_IO", "Win32_Security"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
profiling = ["dep:tauri-plugin-tracing", "dep:tauri-plugin-profiling", "dep:tracing", "tauri/tracing"]
